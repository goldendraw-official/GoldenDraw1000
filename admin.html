<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الآمنة</title>
    <style>
        body { font-family: sans-serif; background: #111827; color: white; text-align: center; padding: 50px 20px; }
        .admin-box { background: #1f2937; padding: 40px; border-radius: 15px; display: inline-block; min-width: 350px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #374151; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 10px; transition: 0.2s; }
        .btn-draw { background: #d4af37; color: #111827; }
        .btn-draw:hover { background: #fff; }
        .btn-reset { background: #ef4444; color: white; font-size: 14px; }
        .btn-reset:hover { background: #b91c1c; }
        .winner-box { margin-top: 30px; padding: 20px; background: #2d3748; border: 2px dashed #d4af37; border-radius: 8px; display: none; text-align: right; }
        .winner-box p { margin: 8px 0; font-size: 16px; border-bottom: 1px solid #374151; padding-bottom: 5px; }
        
        /* واجهة تسجيل دخول المشرف */
        .login-box { background: #1f2937; padding: 30px; border-radius: 15px; display: inline-block; width: 320px; border: 1px solid #374151; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #4b5563; background: #111827; color: white; border-radius: 8px; text-align: center; font-size: 16px; }
        .login-box button { width: 98%; padding: 12px; background: #d4af37; color: #111827; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- 1. واجهة التحقق من كلمة المرور (تظهر أولاً) -->
<div class="login-box" id="authBox">
    <h2 style="color: #d4af37; margin-top: 0;">تسجيل دخول الإدارة 🔐</h2>
    <p style="color: #9ca3af; font-size: 14px;">أدخل كلمة المرور الخاصة بك لإدارة السحب</p>
    <input type="password" id="adminPassword" placeholder="كلمة المرور">
    <button onclick="checkPassword()">دخول اللوحة</button>
</div>

<!-- 2. لوحة التحكم الأساسية (مخفية وتفتح بعد كتابة كلمة المرور الصحيحة) -->
<div class="admin-box" id="mainAdminBox" style="display: none;">
    <h1>لوحة إدارة السحب المباشرة 📊</h1>
    <p>إجمالي المشتركين الحاليين بالموقع: <span id="count" style="font-weight: bold; color: #d4af37; font-size: 24px;">جاري تحديث القائمة...</span></p>
    
    <button class="btn btn-draw" onclick="drawWinner()">🎯 إجراء القرعة واختيار فائز</button>
    <br>
    <button class="btn btn-reset" onclick="resetContest()">🗑️ تصفير المسابقة لشهر جديد</button>

    <div class="winner-box" id="winnerBox">
        <h2 style="color: #d4af37; text-align: center; margin-top: 0;">🎉 بيانات الفائز المحظوظ:</h2>
        <div id="winnerDetails"></div>
    </div>
</div>

<script>
const DATA_URL = "https://jsonbin.io"; 
const API_KEY = "$2b$10$X8O6P0pB1U3fN1w2h3g4e5u6i7o8p9a0s1d2f3g4h5j6k7l8m9n0o";

// دالة التحقق من كلمة المرور المطلوبة
function checkPassword() {
    const passInput = document.getElementById('adminPassword').value;
    const correctPass = "OUSSAMA 3"; // كلمة المرور الخاصة بك مع مراعاة المسافة

    if (passInput === correctPass) {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('mainAdminBox').style.display = 'inline-block';
        updateCount();
        setInterval(updateCount, 10000); // تحديث القائمة دورياً
    } else {
        alert("كلمة المرور غير صحيحة! حاول مجدداً.");
    }
}

async function updateCount() {
    try {
        const response = await fetch(DATA_URL, { headers: { "X-Master-Key": API_KEY } });
        const result = await response.json();
        const participants = result.record.contestants || [];
        document.getElementById('count').innerText = participants.length;
    } catch (error) {
        document.getElementById('count').innerText = "خطأ في الاتصال بالموقع الأول";
    }
}

async function drawWinner() {
    try {
        const response = await fetch(DATA_URL, { headers: { "X-Master-Key": API_KEY } });
        const result = await response.json();
        const participants = result.record.contestants || [];
        
        if (participants.length === 0) {
            alert("لم يسجل أحد في الموقع الأول بعد!");
            return;
        }
        
        const randomIndex = Math.floor(Math.random() * participants.length);
        const winner = participants[randomIndex];
        
        const detailsContainer = document.getElementById('winnerDetails');
        detailsContainer.innerHTML = ""; 
        
        const translate = {
            username: "الاسم الكامل",
            useremail: "البريد الإلكتروني",
            instagram: "حساب إنستغرام",
            timestamp: "وقت التسجيل"
        };

        for (let key in winner) {
            const label = translate[key] || key;
            detailsContainer.innerHTML += `<p><strong>📌 ${label}:</strong> ${winner[key]}</p>`;
        }
        
        document.getElementById('winnerBox').style.display = "block";
    } catch (error) {
        alert("فشل جلب البيانات المباشرة!");
    }
}

async function resetContest() {
    if (confirm("هل أنت متأكد من تصفير قائمة الموقع لبدء سحب شهر جديد؟")) {
        try {
            await fetch(DATA_URL, {
                method: 'PUT',
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify({ contestants: [] })
            });
            updateCount();
            document.getElementById('winnerBox').style.display = "none";
            alert("تم تصفير القائمة بنجاح وجاهز لاستقبال مسجلين جدد!");
        } catch (error) {
            alert("فشل تصفير القائمة!");
        }
    }
}
</script>
</body>
</html>
