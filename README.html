<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة الذكية - محمية</title>
    <style>
        /* إخفاء المحتوى الافتراضي تماماً لحماية البيانات */
        body { font-family: sans-serif; background: #111827; color: white; text-align: center; padding: 50px 20px; display: none; }
        .admin-box { background: #1f2937; padding: 40px; border-radius: 15px; display: inline-block; min-width: 350px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #374151; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 10px; transition: 0.2s; }
        .btn-draw { background: #d4af37; color: #111827; }
        .btn-draw:hover { background: #fff; }
        .btn-reset { background: #ef4444; color: white; font-size: 14px; }
        .btn-reset:hover { background: #b91c1c; }
        .winner-box { margin-top: 30px; padding: 20px; background: #2d3748; border: 2px dashed #d4af37; border-radius: 8px; display: none; text-align: right; }
        .winner-box p { margin: 8px 0; font-size: 16px; border-bottom: 1px solid #374151; padding-bottom: 5px; }
    </style>
</head>
<body>

<!-- نظام التحقق الفوري من كلمة السر قبل عرض أي بيانات للزائر -->
<script>
    // ==========================================
    // 🔐 رمز الحماية الخاص بك (تم تعديله بنجاح)
    // ==========================================
    const SECRET_PIN = "OUSSAMA 3"; 

    const userPassword = prompt("الرجاء إدخال الرمز السري للدخول إلى لوحة التحكم:");
    
    // فحص كلمة السر المدخلة ومقارنتها بالرمز المطلوب
    if (userPassword !== null && userPassword.trim() === SECRET_PIN) {
        // الرمز صحيح: يتم السماح بالدخول وإظهار لوحة التحكم
        document.body.style.display = "block";
    } else {
        // الرمز خاطئ: يتم طرد الزائر مباشرة وإعادته لصفحة التسجيل index.html
        alert("رمز سري خاطئ! ليس لديك صلاحية الدخول.");
        window.location.href = "index.html"; 
    }
</script>

<div class="admin-box">
    <h1>لوحة إدارة السحب الذكية 📊</h1>
    <p>إجمالي المشتركين النشطين: <span id="count" style="font-weight: bold; color: #d4af37; font-size: 24px;">0</span></p>
    <button class="btn btn-draw" onclick="drawWinner()">🎯 إجراء القرعة واختيار فائز</button>
    <br>
    <button class="btn btn-reset" onclick="resetContest()">🗑️ تصفير المسابقة لشهر جديد</button>
    <div class="winner-box" id="winnerBox">
        <h2 style="color: #d4af37; text-align: center; margin-top: 0;">🎉 بيانات الفائز المحظوظ:</h2>
        <div id="winnerDetails"></div>
    </div>
</div>

<script>
function updateCount() {
    const participants = JSON.parse(localStorage.getItem('contestants')) || [];
    document.getElementById('count').innerText = participants.length;
}
updateCount();

function drawWinner() {
    const participants = JSON.parse(localStorage.getItem('contestants')) || [];
    if (participants.length === 0) { alert("لا يوجد مشاركون في السحب حالياً!"); return; }
    const randomIndex = Math.floor(Math.random() * participants.length);
    const winner = participants[randomIndex];
    const detailsContainer = document.getElementById('winnerDetails');
    detailsContainer.innerHTML = "";
    const translate = { username: "الاسم الكامل", useremail: "البريد الإلكتروني", instagram: "حساب إنستغرام", timestamp: "وقت التسجيل" };
    for (let key in winner) {
        const label = translate[key] || key;
        detailsContainer.innerHTML += `<p><strong>📌 ${label}:</strong> ${winner[key]}</p>`;
    }
    document.getElementById('winnerBox').style.display = "block";
}

function resetContest() {
    if (confirm("هل أنت متأكد من حذف القائمة لبدء شهر جديد؟")) {
        localStorage.removeItem('contestants'); updateCount();
        document.getElementById('winnerBox').style.display = "none"; alert("تم تصفير القائمة بنجاح!");
    }
}
</script>
</body>
</html>
